name = "assistant-2api-worker"
main = "src/index.ts"
compatibility_date = "2024-05-12"

[vars]
# Only the origin is used; /api/chat or /api/doc/chat is picked per model
UPSTREAM_URL = "https://www.assistant-ui.com"
# Optional: route through your own proxy to avoid CF shared IP rate limits
# PROXY_URL = "https://your-vps.example.com/proxy"
PROXY_URL = ""

# ⚠ Do NOT put your API key here — use Cloudflare secrets instead:
#   npx wrangler secret put API_KEY
# Leaving API_KEY unset means open access (no auth required).

# Optional: host large base64 images so upstream gets a URL instead of the data URI
# (upstream counts the data URI as message text: anything over ~12 KB is rejected).
#   npx wrangler kv namespace create IMAGES   → paste the id below and uncomment
# [[kv_namespaces]]
# binding = "IMAGES"
# id = "<your-namespace-id>"
